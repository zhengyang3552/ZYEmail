name: CI

# 统一 Android CI 规范（与 RemoteFileManager / ZYNotificationHistory 同构）：
#   push main / v* 标签 / PR / 手动触发；质量门(build) -> lint -> release 三段。
# 说明：本仓库 gradlew 是自定义脚本（依赖 ANDROID_HOME 且每次下载发行包），
# CI 用 setup-gradle 提供的同版本 Gradle 直接调用，避免重复下载。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

# 同分支新提交取消旧构建，省额度也省等待
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认只给读权限；发 Release 的 job 单独提权
permissions:
  contents: read

env:
  GRADLE_VERSION: '8.2'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
    -Dkotlin.daemon.jvm.options=-Xmx1536m

jobs:
  # ------------------------------------------------------- 单测 + Debug 构建
  build:
    name: 测试 / 构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle 8.2（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'

      # Runner 镜像的 SDK 组件随镜像更新，显式补齐并接受许可，防止某天组件漂移
      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          else
            echo "sdkmanager not found, fallback to preinstalled SDK"
          fi

      # 仓库暂无单元测试，此命令在零测试时直接通过；补测试后自动生效
      - name: 单元测试
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 构建 Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 写入构建摘要
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          {
            echo "### Debug APK"
            echo "- 产物：\`$APK\`"
            echo "- 大小：$(du -h "$APK" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ZYEmail-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ZYEmail-unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

  # ----------------------------------------------------------------- Lint
  lint:
    name: Lint 检查
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle 8.2（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          fi

      # lintDebug 只分析 debug variant，比全量 lint 快
      - name: 运行 Lint
        run: gradle :app:lintDebug --no-daemon --stacktrace

      # AGP 8.x 的报告文件名带 variant 后缀
      - name: 汇总 Lint 结果
        if: always()
        run: |
          REPORT="app/build/reports/lint-results-debug.txt"
          {
            echo "### Lint"
            if [ -f "$REPORT" ]; then
              echo "- 错误数：$(grep -c 'Error:' "$REPORT" || true)"
              echo "- 提示数：$(grep -c 'Warning:' "$REPORT" || true)"
            else
              echo "未生成 lint 报告"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ZYEmail-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------- Release（仅 v* 标签触发）
  release:
    name: 发布 Release APK
    needs: [build, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle 8.2（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          fi

      # 未配置签名时产出 unsigned 包，仅验证 release 配置可编译
      - name: 构建 Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: 重命名 APK（带版本号）
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            mv "$f" "dist/ZYEmail-${GITHUB_REF_NAME}-release.apk"
          done
          ls -lh dist/

      - name: 创建 Release 并附加 APK
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
