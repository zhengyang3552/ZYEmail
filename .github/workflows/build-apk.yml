name: Build APK

# 触发方式：
#   · push 到 main / master / develop
#   · 任意指向 main / master 的 PR
#   · 推送 v* 标签（额外产出 release 包）
#   · 手动触发（Actions 页面 Run workflow）
on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# 同一分支的新提交会取消上一次未完成的构建，节省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_COMPILE_SDK: 34
  ANDROID_BUILD_TOOLS: 34.0.0
  ANDROID_MIN_SDK: 24
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
    -Dkotlin.daemon.jvm.options=-Xmx1536m

jobs:
  # ----------------------------------------------------------- 编译 Debug 包
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 提供与本地一致的 Gradle 8.2，并缓存依赖与构建缓存。
      # 说明：仓库内的 gradlew 是自定义脚本（依赖 ANDROID_HOME，且每次都下载发行包），
      # CI 直接使用 setup-gradle 提供的同版本 Gradle，避免重复下载 120MB。
      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # Runner 镜像自带的 SDK 组件会随镜像更新，这里显式补齐并接受许可
      - name: Ensure Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          else
            echo "sdkmanager not found, fallback to preinstalled SDK"
          fi
          echo "ANDROID_HOME=${ANDROID_HOME}"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Report build result
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          {
            echo "### Debug APK"
            echo "- 产物：\`$APK\`"
            echo "- 大小：$(du -h "$APK" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------ Lint
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Ensure Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          fi

      # lintDebug 只分析 debug variant，比全量 lint 快；出现 error 时任务失败
      - name: Run lint
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Publish lint summary
        if: always()
        run: |
          REPORT="app/build/reports/lint-results-debug.txt"
          {
            echo "### Lint"
            if [ -f "$REPORT" ]; then
              echo "- 错误数：$(grep -c 'Error:' "$REPORT" || true)"
              echo "- 提示数：$(grep -c 'Warning:' "$REPORT" || true)"
              echo '```'
              grep -oE "\[[A-Za-z]+\]$" "$REPORT" | sort | uniq -c | sort -rn | head -10 || true
              echo '```'
            else
              echo "未生成 lint 报告"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 注意：AGP 8.x 的报告文件名带 variant 后缀
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------- 可选：Release 包（标签 / 手动）
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [ lint ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Ensure Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          fi

      # 未配置签名时产出 app-release-unsigned.apk，仅用于验证 release 配置可编译
      - name: Build Release APK (unsigned)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
