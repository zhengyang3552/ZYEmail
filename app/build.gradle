plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Room 的注解处理器需要 kapt；原工程使用 annotationProcessor，
    // 对 Kotlin 实体不生效，会导致 DAO 实现类无法生成。
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.zy.email'
    compileSdk 34

    defaultConfig {
        applicationId "com.zy.email"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    // JavaMail 的 android-mail 与 android-activation 都自带 META-INF 许可文件，
    // 直接打包会因同名文件冲突而失败，这里统一排除（不影响运行）。
    packaging {
        resources {
            excludes += [
                    'META-INF/NOTICE.md',
                    'META-INF/LICENSE.md',
                    'META-INF/NOTICE',
                    'META-INF/LICENSE',
                    'META-INF/DEPENDENCIES'
            ]
        }
    }
}

dependencies {
    // AndroidX 基础
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Material 3 组件（主题、卡片、Chip、进度指示器、开关等）
    implementation 'com.google.android.material:material:1.11.0'

    // Activity 的 viewModels() 委托
    implementation 'androidx.activity:activity-ktx:1.8.2'

    // Lifecycle：viewModelScope / lifecycleScope 需要 -ktx 变体
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // 列表与下拉刷新
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Room（使用 kapt 生成实现）
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // SMTP / IMAP
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // 协程
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
}
